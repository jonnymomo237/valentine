<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine?</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        width: 350px;
    }

    h1 {
        color: #ff4d6d;
    }

    button {
        padding: 12px 25px;
        font-size: 18px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        margin: 15px;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
    }

    #noBtn {
        background-color: #ccc;
        position: absolute;
    }

    #message {
        font-size: 22px;
        color: #ff4d6d;
        display: none;
    }
</style>
</head>

<body>

<div class="card" id="card">
    <h1>💘 Will you be my Valentine s? 💘</h1>

    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😢</button>

    <div id="message">
        🎉 Yay!!! You made me the happiest person! 💕🥰
    </div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    const card = document.getElementById("card");

    // Move NO button when mouse gets close
    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    // YES button click
    yesBtn.addEventListener("click", () => {
    card.innerHTML = `
        <h1>💖 Happy Valentine! 💖</h1>
        <p style="font-size:24px;">You said YES!! 🥰💞</p>
        <p>My heart is doing this right now 👉 💓💓💓</p>
        <p>You just made me soooo happy 😘🌹✨</p>
        <p style="font-size:26px;">🥹💕😍</p>
    `;
});

</script>

</body>
</html>
